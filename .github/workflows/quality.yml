name: Academic PPT quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  editable-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-qa.txt
      - run: npm test
      - run: npm run build
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        with:
          name: academic-ppt-example
          path: examples/group-meeting-demo/group-meeting-demo.pptx
